<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แพร</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #timer{
    font-size:40px;
    font-weight:bold;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background-color: #000;
    }

    /* 🎥 วิดีโอพื้นหลังเต็มจอ */
    #bgVideo {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: translate(-50%, -50%);
    z-index: -3;
    }
    

    /* ฉากสลัวทับวิดีโอ */
    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -2;
    }

    /* 🌧️ คอนเทนเนอร์และสไตล์เม็ดฝนตก (Rain Effect) */
    .rain-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* เพื่อให้สามารถคลิกผ่านฝนไปโดนการ์ดได้ */
      z-index: -1; /* ให้อยู่หลังการ์ด แต่อยู่หน้าวิดีโอ */
      overflow: hidden;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.6));
      width: 1px;
      opacity: 0.7;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px);
      }
      100% {
        transform: translateY(100vh);
      }
    }

    /* การ์ด Glassmorphism โปร่งใส */
    .card {
      position: relative;
      width: 320px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3),
                  0 0 40px rgba(186, 104, 200, 0.2);
      text-align: center;
      color: #fff;
      z-index: 1;
    }
      /* 🔴🔴 จัดกลุ่มรูปวงกลมให้อยู่ข้างๆ กัน */
    .profile-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px; /* ระยะห่างระหว่าง 2 วงกลม */
      margin-bottom: 15px;
    }
     /* 💖 วงกลมหัวใจอันใหม่ */
    .heart-circle {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }
    /* เอฟเฟกต์หัวใจเต้นดุกดิก */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* รูปโปรไฟล์ */
    .avatar-wrapper {
      position: relative;
      width: 95px;
      height: 95px;
      margin: 0 auto 15px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    /* ชื่อ */
    .name {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 25px;
    }

    /* โซน Social Media Icons */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    /* สภาพปกติ: สีโปร่งใสอมขาว */
    .social-btn {
      font-size: 2rem;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
    }

    /* --- ตอนเอาเมาส์ชี้ (Hover Effect) --- */
    .social-btn:hover {
      transform: translateY(-5px) scale(1.25);
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.9),
                   0 0 20px rgba(255, 255, 255, 0.6);
    }

    /* --- ตอนกดไอคอน (Active Colors) --- */
    .social-btn.facebook.active,
    .social-btn.facebook:active {
      color: #1877f2;
      text-shadow: 0 0 15px #1877f2, 0 0 30px rgba(24, 119, 242, 0.8);
    }

    .social-btn.instagram.active,
    .social-btn.instagram:active {
      color: #e1306c;
      text-shadow: 0 0 15px #e1306c, 0 0 30px rgba(225, 48, 108, 0.8);
    }

    .social-btn.tiktok.active,
    .social-btn.tiktok:active {
      color: #ffffff;
      text-shadow: -2px 2px 10px #ff0050, 2px -2px 10px #00f2fe;
    }

    .social-btn.discord.active,
    .social-btn.discord:active {
      color: #5865f2;
      text-shadow: 0 0 15px #5865f2, 0 0 30px rgba(88, 101, 242, 0.8);
    }

    /* ส่วนท้าย: เครดิตผู้จัดทำ / ลิงก์ร้านค้า */
    .footer-credit {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 15px;
    }

    .footer-credit a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s ease;
    }

    .footer-credit a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline id="bgVideo">
    <source src="https://www.image2url.com/r2/default/videos/1785077372557-d0a2c2e1-571c-4321-b9e2-d6bca1010757.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <div class="rain-container" id="rainContainer"></div>

  <div class="card" id="profileCard">
    
    <div class="avatar-wrapper">
      <img class="avatar" src="https://cdn.phototourl.com/free/2026-07-27-a23c5493-8da2-4ab4-92e3-19572519b9f6.jpg" alt="Profile Avatar">
       

      
    </div>

    <div class="name">@sx.j_2m</div>

          
<h4>สถานะปัจุบัน</h4><br>
      <p>คบหากับ ชิน รักชินที่สุดในโลก</p>
    <div class="social-links">
      <div id="timer">
    2578 ชั่วโมง<br> 60 นาที <br>00 วินาที
</div>

<script>
let hours = 2578;
let minutes = 60;
let seconds = 0;

function updateTimer(){
    seconds++;

    if(seconds >= 60){
        seconds = 0;
        minutes++;
    }

    if(minutes >= 60){
        minutes = 0;
        hours++;
    }

    document.getElementById("timer").innerHTML =
        `${hours} ชั่วโมง ${String(minutes).padStart(2,"0")} นาที ${String(seconds).padStart(2,"0")} วินาที`;
}

setInterval(updateTimer,1000);
</script>

      

      
    </div>

    <div class="footer-credit">
      สนใจทำเว็บ <a href="./chin.html" target="_blank">(คลิกเลย)</a>
    </div>

  </div>

  <script>
    // สคริปต์เปลี่ยนสีไอคอนเมื่อกด
    function setActive(element) {
      const buttons = document.querySelectorAll('.social-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    // 🌧️ สคริปต์สร้างเม็ดฝนตกแบบสุ่ม (Rain Effect Generator)
    function createRain() {
      const rainContainer = document.getElementById('rainContainer');
      const dropCount = 90; // จำนวนเม็ดฝนบนหน้าจอ

      for (let i = 0; i < dropCount; i++) {
        const drop = document.createElement('div');
        drop.classList.add('drop');

        // สุ่มตำแหน่งX, ความยาวเม็ดฝน, และความเร็ว
        const randomLeft = Math.random() * 100; // ตำแหน่งแนวนอน (0-100%)
        const randomHeight = Math.random() * 50 + 20; // ความยาวหยดน้ำ (20px - 70px)
        const randomDuration = Math.random() * 0.7 + 0.5; // ความเร็วตก (0.5s - 1.2s)
        const randomDelay = Math.random() * 2; // หน่วงเวลาเริ่มตก

        drop.style.left = randomLeft + '%';
        drop.style.height = randomHeight + 'px';
        drop.style.animationDuration = randomDuration + 's';
        drop.style.animationDelay = randomDelay + 's';

        rainContainer.appendChild(drop);
      }
    }

    // เรียกใช้งานสร้างฝนตกเมื่อเปิดหน้าเว็บ
    createRain();
  </script>

</body>
</html>
