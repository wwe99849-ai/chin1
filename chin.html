<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Link Profile (Apps & Games)</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      background-color: #000;
      padding: 20px 0;
    }

    /* 🎥 วิดีโอพื้นหลัง */
    #bgVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -3;
      object-fit: cover;
    }

    /* ฉากสลัวทับวิดีโอ */
    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -2;
    }

    /* 🌧️ เลเยอร์เม็ดฝนตก */
    .rain-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.6));
      width: 1px;
      opacity: 0.7;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(100vh); }
    }

    /* การ์ด Glassmorphism */
    .card {
      position: relative;
      width: 350px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      text-align: center;
      color: #fff;
      z-index: 1;
    }

    /* กล่องหุ้มรูปโปรไฟล์ */
    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 15px auto;
    }

    /* รูปโปรไฟล์วงกลมเดี่ยว */
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    /* ชื่อ */
    .name {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* หัวข้อกลุ่ม */
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      margin: 20px 0 10px 0;
      text-align: left;
      padding-left: 5px;
    }

    /* 📱 รายการปุ่มลิงก์ */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .link-list::-webkit-scrollbar {
      width: 4px;
    }
    .link-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    /* โครงสร้างปุ่ม */
    .social-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    /* ขนาดไอคอนแอป (FontAwesome) */
    .social-btn i {
      font-size: 1.4rem;
      width: 28px;
      text-align: center;
    }

    /* ขนาดโลโก้เกม (รูปภาพ PNG) */
    .social-btn .game-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .social-btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: rgba(255, 255, 255, 0.18);
    }

    /* 🎨 สีเปลี่ยนเรืองแสงเมื่อกด (Active) */
    
    /* Social Apps */
    .social-btn.facebook.active { background: rgba(24, 119, 242, 0.25); border-color: #1877f2; box-shadow: 0 0 18px #1877f2; color: #1877f2; }
    .social-btn.instagram.active { background: rgba(225, 48, 108, 0.25); border-color: #e1306c; box-shadow: 0 0 18px #e1306c; color: #e1306c; }
    .social-btn.tiktok.active { background: rgba(0, 0, 0, 0.4); border-color: #00f2fe; box-shadow: -3px 3px 15px #ff0050, 3px -3px 15px #00f2fe; color: #ffffff; }
    .social-btn.discord.active { background: rgba(88, 101, 242, 0.25); border-color: #5865f2; box-shadow: 0 0 18px #5865f2; color: #5865f2; }
    .social-btn.line.active { background: rgba(6, 199, 85, 0.25); border-color: #06c755; box-shadow: 0 0 18px #06c755; color: #06c755; }

    /* 🎮 Games (สีเรืองแสงเฉพาะตัวของโลโก้เกมจริง) */
    .social-btn.roblox.active { background: rgba(227, 35, 38, 0.2); border-color: #e32326; box-shadow: 0 0 18px #e32326; color: #ff4d4d; }
    .social-btn.minecraft.active { background: rgba(85, 255, 85, 0.2); border-color: #55ff55; box-shadow: 0 0 18px #55ff55; color: #55ff55; }
    .social-btn.genshin.active { background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; box-shadow: 0 0 18px #00e5ff; color: #00e5ff; }
    .social-btn.valorant.active { background: rgba(255, 70, 85, 0.2); border-color: #ff4655; box-shadow: 0 0 18px #ff4655; color: #ff4655; }

    /* ส่วนท้ายเครดิต */
    .footer-credit {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 18px;
      margin-top: 20px;
    }

    .footer-credit a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
    }

    .footer-credit a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline id="bgVideo">
    <source src="https://www.image2url.com/r2/default/videos/1785128947023-e362702d-c578-4b0f-8f4f-b0c605fc1388.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <div class="rain-container" id="rainContainer"></div>

  <div class="card" id="profileCard">
    
    <div class="avatar-wrapper">
      <img class="avatar" src="C:\Users\BDE\Downloads\codechin\4177.jpg" alt="Profile Avatar">
    </div>

    <div class="name">สนใจทำเว็บเป็นของตัวเองทักมาได้ที่ลิ้ง ลายกับดิส เท่านั้น  <br>ราคาเพียง70บาท</div>

    <div class="link-list">
      
    

      

      <a href="https://discord.com" target="_blank" class="social-btn discord" onclick="setActive(this)">
        <i class="fa-brands fa-discord"></i>
        <span>Discord Server</span>
      </a>

      <a href="https://line.me" target="_blank" class="social-btn line" onclick="setActive(this)">
        <i class="fa-brands fa-line"></i>
        <span>Line Official</span>
      </a>

      

    </div>

    <div class="footer-credit">
       <a href="https://your-shop-link.com" target="_blank"> (กลับ)</a>
    </div>

  </div>

  <script>
    // ฟังก์ชันเปลี่ยนสีเมื่อกดเลือกแอป/เกม
    function setActive(element) {
      const buttons = document.querySelectorAll('.social-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    // ฟังก์ชันสร้างเม็ดฝน
    function createRain() {
      const rainContainer = document.getElementById('rainContainer');
      const dropCount = 90;

      for (let i = 0; i < dropCount; i++) {
        const drop = document.createElement('div');
        drop.classList.add('drop');

        const randomLeft = Math.random() * 100;
        const randomHeight = Math.random() * 50 + 20;
        const randomDuration = Math.random() * 0.7 + 0.5;
        const randomDelay = Math.random() * 2;

        drop.style.left = randomLeft + '%';
        drop.style.height = randomHeight + 'px';
        drop.style.animationDuration = randomDuration + 's';
        drop.style.animationDelay = randomDelay + 's';

        rainContainer.appendChild(drop);
      }
    }

    createRain();
  </script>

</body>
</html>
